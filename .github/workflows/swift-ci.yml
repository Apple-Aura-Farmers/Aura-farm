# Gate for merging into main: every pull request has to build and pass the unit
# tests on an iOS Simulator before it is merged.
name: Swift CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # So the same gate runs inside a merge queue, if one is turned on later.
  merge_group:

concurrency:
  group: swift-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - run: xcodebuild -version

      # The runner image decides which simulators exist, so pick the newest
      # iPhone that is installed instead of naming a device that may not be.
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available \
            | grep -E '^ +iPhone' | tail -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "No iPhone simulator on this runner:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild test \
            -project MicroscopeCounter/MicroscopeCounter.xcodeproj \
            -scheme MicroscopeCounter \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  lint:
    name: Format check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # swift-format ships with Xcode, so this adds no dependency. Settings are
      # in .swift-format at the repository root.
      - name: swift-format lint
        run: |
          xcrun swift-format lint --recursive --strict \
            MicroscopeCounter/Sources MicroscopeCounter/Tests
